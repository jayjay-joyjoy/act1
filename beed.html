<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BEED — AACCUP Accreditation System</title>

    <!-- ===== GOOGLE FONTS ===== -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&family=Orbitron:wght@400..900&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- ===== FONT AWESOME ===== -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <!-- ===== ANIMATE.CSS (lightweight) ===== -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />

    <style>
        /* ============================================================
               BEED — UPDATED LIGHT MODE
               Dark header/footer (amber/teal) + solid white buttons
               with traveling light (amber/teal)
               ============================================================ */

        /* ---- ROOT VARIABLES (LIGHT MODE) ---- */
        :root {
            --beed-bg: #F7F2EC;
            --beed-bg-secondary: #F0E8DE;
            --beed-card: rgba(255, 255, 255, 0.72);
            --beed-card-hover: rgba(255, 255, 255, 0.92);
            --beed-card-border: rgba(255, 255, 255, 0.35);
            --beed-shadow: 0 8px 40px rgba(0, 0, 0, 0.04);
            --beed-shadow-hover: 0 16px 60px rgba(0, 0, 0, 0.07);

            --beed-amber: #F5A623;
            --beed-amber-dark: #D48E1A;
            --beed-amber-light: #FDE8B3;
            --beed-gold: #F7C948;
            --beed-gold-light: #FDF0D0;
            /* ---- Was green (teal) — now replaced with orange (system palette) ---- */
            --beed-teal: #E8953A;
            --beed-teal-dark: #D48E1A;
            --beed-teal-light: #FDE8B3;
            --beed-teal-soft: #FDF0D0;
            --beed-orange: #E8953A;
            --beed-brown: #4A3426;
            --beed-brown-light: #7A5F4A;

            --beed-text: #2D1F14;
            --beed-text-muted: #6B5A4A;
            --beed-text-dim: #A69380;

            --glow-amber: 0 0 40px rgba(245, 166, 35, 0.15);
            --glow-amber-strong: 0 0 60px rgba(245, 166, 35, 0.25);
            /* ---- Was green glow — now orange glow ---- */
            --glow-teal: 0 0 40px rgba(232, 149, 58, 0.15);
            --glow-teal-strong: 0 0 60px rgba(232, 149, 58, 0.25);
            --glow-gold: 0 0 40px rgba(247, 201, 72, 0.15);

            --radius: 18px;
            --radius-sm: 12px;
            --radius-full: 9999px;
            --ease: cubic-bezier(0.4, 0, 0.2, 1);
            --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
            --ease-spring: cubic-bezier(0.175, 0.885, 0.32, 1.275);

            --glass-bg: rgba(255, 255, 255, 0.55);
            --glass-border: rgba(255, 255, 255, 0.25);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.04);

            /* ---- LIGHT MODE: DARK HEADER/FOOTER (AMBER/TEAL) ---- */
            --header-bg: linear-gradient(135deg, #c48b06 0%, #a77b0d 100%);
            --footer-bg: #906d19;
            --header-border: 4px solid #F5A623;
            --footer-border: 6px solid #F5A623;

            --orb1-color: rgba(245, 166, 35, 0.06);
            /* ---- Was green orb — now orange orb ---- */
            --orb2-color: rgba(232, 149, 58, 0.06);
            --orb3-color: rgba(247, 201, 72, 0.04);

            --scrollbar-track: #F7F2EC;
            --scrollbar-thumb: var(--beed-amber);

            /* ---- Solid button backgrounds (non‑transparent) ---- */
            --beed-btn-bg: #FFFFFF;
            --beed-btn-bg-hover: #F7F2EC;
            --beed-btn-after-bg: #FFFFFF;

            /* ---- Header scan line colors ---- */
            --header-scan-color1: var(--beed-amber);
            --header-scan-color2: var(--beed-teal);
        }

        /* ---- DARK MODE ---- */
        [data-theme="dark"] {
            --beed-bg: #1A1512;
            --beed-bg-secondary: #241E19;
            --beed-card: rgba(30, 26, 22, 0.78);
            --beed-card-hover: rgba(40, 35, 30, 0.92);
            --beed-card-border: rgba(255, 255, 255, 0.08);
            --beed-shadow: 0 8px 40px rgba(0, 0, 0, 0.3);
            --beed-shadow-hover: 0 16px 60px rgba(0, 0, 0, 0.4);

            --beed-text: #F0EAE4;
            --beed-text-muted: #B5A696;
            --beed-text-dim: #7A6B5A;

            --beed-brown: #D4C5B8;
            --beed-brown-light: #B5A696;

            --glass-bg: rgba(30, 26, 22, 0.6);
            --glass-border: rgba(255, 255, 255, 0.06);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);

            --header-bg: rgba(26, 21, 18, 0.85);
            --footer-bg: rgba(26, 21, 18, 0.85);
            --header-border: 2px solid rgba(245, 166, 35, 0.15);
            --footer-border: 2px solid rgba(245, 166, 35, 0.08);

            --orb1-color: rgba(245, 166, 35, 0.05);
            /* ---- Was green orb — now orange orb ---- */
            --orb2-color: rgba(232, 149, 58, 0.05);
            --orb3-color: rgba(247, 201, 72, 0.03);

            --scrollbar-track: #1A1512;
            --scrollbar-thumb: var(--beed-amber);

            --beed-amber: #F5A623;
            --beed-gold: #F7C948;
            --beed-teal: #F5A623;
            --beed-orange: #E8953A;

            --beed-btn-bg: #1A1512;
            --beed-btn-bg-hover: #241E19;
            --beed-btn-after-bg: #1A1512;

            .beed-watermark {
                opacity: 0.1 !important;
            }
        }

        /* ---- LIGHT MODE: HEADER OVERRIDES ---- */
        [data-theme="light"] header {
            color: #ffffff;
            border-bottom: 4px solid #F5A623;
        }

        [data-theme="light"] header::after {
            /* ---- Was teal — now orange ---- */
            background: linear-gradient(90deg, transparent, #F5A623, #E8953A, #F5A623, transparent);
            opacity: 0.5;
        }

        [data-theme="light"] .title-block h1 {
            /* gradient text handled below */
            text-shadow: none;
        }

        [data-theme="light"] .title-block .sub-header {
            color: #FDE8B3;
        }

        [data-theme="light"] .logo {
            border-color: #F5A623;
            box-shadow: 0 4px 24px rgba(245, 166, 35, 0.2);
        }

        [data-theme="light"] .logo-ring {
            /* ---- Was teal — now orange ---- */
            background: conic-gradient(from 0deg, #F5A623, #E8953A, #F7C948, #F5A623);
        }

        /* ---- LIGHT MODE: FOOTER OVERRIDES ---- */
        [data-theme="light"] footer {
            color: rgba(255, 255, 255, 0.8);
            border-top: 6px solid #F5A623;
        }

        [data-theme="light"] footer strong {
            color: #ffffff;
        }

        [data-theme="light"] footer .footer-course {
            color: #FDE8B3;
        }

        [data-theme="light"] footer .footer-divider {
            background: linear-gradient(90deg, #F5A623);
            box-shadow: 0 0 30px rgba(245, 166, 35, 0.3);
        }

        [data-theme="light"] footer .footer-contact .value {
            color: #FDE8B3;
            text-shadow: 0 0 20px rgba(245, 166, 35, 0.2);
        }

        [data-theme="light"] footer .footer-contact .label {
            opacity: 0.6;
        }

        [data-theme="light"] footer::before {
            /* ---- Was teal — now orange ---- */
            background: linear-gradient(90deg, transparent, #F5A623, #E8953A, #F5A623, transparent);
            opacity: 0.5;
        }

        /* ---- LIGHT MODE: BUTTON OVERRIDES (solid white) ---- */
        [data-theme="light"] .btn-neon {
            background: #ffffff;
            border: 2px solid #E8DDD0;
            color: #2D1F14;
            box-shadow: var(--beed-shadow);
        }

        [data-theme="light"] .btn-neon::after {
            background: #ffffff;
        }

        [data-theme="light"] .btn-neon:hover {
            transform: translateY(-6px) scale(1.01);
            box-shadow: var(--beed-shadow-hover), 0 0 25px rgba(245, 166, 35, 0.12);
            border-color: #F5A623;
        }

        [data-theme="light"] .btn-neon:hover::after {
            background: #FAF6F0;
        }

        [data-theme="light"] .btn-area-neon {
            --border-color1: #D48E1A;
        }
        [data-theme="light"] .btn-param-neon {
            --border-color1: var(--beed-amber);
        }
        [data-theme="light"] .btn-cat-neon {
            --border-color1: #F7C948;
        }
        [data-theme="light"] .btn-doc-neon {
            --border-color1: #E8953A;
        }
        [data-theme="light"] .btn-extra-neon {
            --border-color1: var(--beed-amber);
        }

        /* ---- LIGHT MODE: BACK BUTTON ---- */
        [data-theme="light"] .btn-back {
            color: #4A3426;
            background: #ffffff;
            border: 2px solid #E8DDD0;
        }

        [data-theme="light"] .btn-back::after {
            background: #ffffff;
        }

        [data-theme="light"] .btn-back:hover {
            transform: translateY(-3px);
            border-color: #F5A623;
            box-shadow: var(--beed-shadow-hover), 0 0 20px rgba(245, 166, 35, 0.08);
        }

        [data-theme="light"] .btn-back::before {
            background: conic-gradient(
                from var(--angle),
                transparent 0deg,
                #F5A623 10deg,
                transparent 24deg,
                transparent 176deg,
                #F5A623 186deg,
                transparent 200deg,
                transparent 360deg
            );
        }

        /* ---- LIGHT MODE: OPEN BUTTON ---- */
        [data-theme="light"] .btn-open {
            color: #4A3426;
            background: #FDF0D0;
            border: 2px solid #F5A623;
        }

        [data-theme="light"] .btn-open::after {
            background: #FDF0D0;
        }

        [data-theme="light"] .btn-open:hover {
            transform: translateY(-4px);
            border-color: #D48E1A;
            box-shadow: var(--beed-shadow-hover), 0 0 30px rgba(245, 166, 35, 0.15);
        }

        [data-theme="light"] .btn-open:hover::after {
            background: #FDE8B3;
        }

        /* ---- LIGHT MODE: NUM & LETTER BADGES ---- */
        [data-theme="light"] .area-grid .num {
            background: linear-gradient(160deg, #F5A623, #D48E1A);
        }
        [data-theme="light"] .param-grid .letter {
            /* ---- Was teal — now orange/gold ---- */
            background: linear-gradient(160deg, #E8953A, #D48E1A);
        }

        /* ---- LIGHT MODE: ICONS ---- */
        [data-theme="light"] .btn-neon .icon {
            color: #F5A623;
            filter: drop-shadow(0 0 10px rgba(245, 166, 35, 0.2));
        }
        [data-theme="light"] .doc-grid .btn-neon .icon {
            color: #F5A623;
            filter: drop-shadow(0 0 10px rgba(245, 166, 35, 0.1));
        }
        [data-theme="light"] .hierarchy-grid .file-icon {
            color: #F5A623;
            filter: drop-shadow(0 0 8px rgba(245, 166, 35, 0.08));
        }
        [data-theme="light"] .area-grid .arrow,
        [data-theme="light"] .param-grid .arrow,
        [data-theme="light"] .hierarchy-grid .arrow {
            color: #F5A623;
        }

        /* ---- LIGHT MODE: BREADCRUMB ---- */
        [data-theme="light"] .breadcrumb a {
            /* ---- Was green — now orange ---- */
            color: #E8953A;
        }
        [data-theme="light"] .breadcrumb a::after {
            background: #F5A623;
        }
        [data-theme="light"] .breadcrumb a:hover {
            background: rgba(232, 149, 58, 0.06);
            color: #F5A623;
        }
        [data-theme="light"] .breadcrumb .current {
            background: rgba(245, 166, 35, 0.06);
            border-color: rgba(245, 166, 35, 0.08);
            color: var(--beed-text);
        }

        /* ---- LIGHT MODE: SEARCH ---- */
        [data-theme="light"] .search-container input {
            background: rgba(255, 255, 255, 0.8);
            border-color: #E8DDD0;
        }
        [data-theme="light"] .search-container input:focus {
            border-color: #F5A623;
            box-shadow: 0 0 0 3px rgba(245, 166, 35, 0.08), var(--glow-amber);
        }

        /* ---- LIGHT MODE: EMPTY STATE ---- */
        [data-theme="light"] .empty-state {
            background: rgba(255, 255, 255, 0.6);
            border-color: #E8DDD0;
        }
        [data-theme="light"] .empty-state .icon {
            color: #F5A623;
        }
        [data-theme="light"] .empty-state h3 {
            color: #4A3426;
        }

        /* ---- LIGHT MODE: PDF CONTAINER ---- */
        [data-theme="light"] .pdf-container {
            background: white;
            border-color: #E8DDD0;
            box-shadow: var(--beed-shadow);
        }
        [data-theme="light"] .pdf-container:hover {
            border-color: rgba(245, 166, 35, 0.2);
            box-shadow: var(--beed-shadow-hover), var(--glow-amber-strong);
        }
        [data-theme="light"] .pdf-container iframe {
            background: #F0E8DE;
        }

        /* ---- LIGHT MODE: BACKGROUND GRID & ORBS ---- */
        [data-theme="light"] body::before {
            background:
                linear-gradient(rgba(180, 160, 140, 0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(180, 160, 140, 0.06) 1px, transparent 1px);
        }

        /* ---- LIGHT MODE: SCROLLBAR ---- */
        [data-theme="light"] ::-webkit-scrollbar-thumb {
            background: #F5A623;
            box-shadow: 0 0 20px rgba(245, 166, 35, 0.15);
        }
        [data-theme="light"] ::-webkit-scrollbar-thumb:hover {
            /* ---- Was green — now orange ---- */
            background: #E8953A;
            box-shadow: var(--glow-teal);
        }

        /* ============================================================
           CSS PROPERTY for animated angle
           ============================================================ */
        @property --angle {
            syntax: '<angle>';
            initial-value: 0deg;
            inherits: false;
        }

        /* ---- RESET & BASE ---- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            background: var(--beed-bg);
            color: var(--beed-text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-size: 17px;
            line-height: 1.6;
            position: relative;
            overflow-x: hidden;
            transition: background 0.5s var(--ease), color 0.5s var(--ease);
        }

        a {
            color: inherit;
            text-decoration: none;
        }
        button {
            font-family: inherit;
            cursor: pointer;
            border: none;
            background: none;
        }

        /* ============================================================
           DYNAMIC BACKGROUND — Animated Orbs + Grid
           ============================================================ */
        .bg-orbs {
            position: fixed;
            inset: 0;
            z-index: -2;
            pointer-events: none;
            overflow: hidden;
        }

        .bg-orbs .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.5;
            animation: orbFloat 20s ease-in-out infinite alternate;
            will-change: transform;
        }

        .bg-orbs .orb:nth-child(1) {
            width: 600px;
            height: 600px;
            top: -10%;
            left: -5%;
            background: var(--orb1-color);
            animation-duration: 22s;
            animation-delay: -2s;
        }

        .bg-orbs .orb:nth-child(2) {
            width: 500px;
            height: 500px;
            bottom: -10%;
            right: -5%;
            background: var(--orb2-color);
            animation-duration: 26s;
            animation-delay: -6s;
        }

        .bg-orbs .orb:nth-child(3) {
            width: 400px;
            height: 400px;
            top: 40%;
            left: 40%;
            background: var(--orb3-color);
            animation-duration: 18s;
            animation-delay: -10s;
        }

        @keyframes orbFloat {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            33% { transform: translate(60px, -40px) scale(1.05) rotate(3deg); }
            66% { transform: translate(-30px, 50px) scale(0.95) rotate(-2deg); }
            100% { transform: translate(20px, -20px) scale(1.02) rotate(1deg); }
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -1;
            background:
                linear-gradient(rgba(180, 160, 140, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(180, 160, 140, 0.04) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridMove 60s linear infinite;
            pointer-events: none;
        }

        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 60px 60px; }
        }

        .beed-watermark {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: -1;
            opacity: 0.1;
            pointer-events: none;
            user-select: none;
            width: 600px;
            height: 600px;
            background: url('images/beed-logo.png') center/contain no-repeat;
            animation: watermarkPulse 25s ease-in-out infinite alternate;
            transition: opacity 0.5s var(--ease);
        }

        @keyframes watermarkPulse {
            0% { opacity: 0.10; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0.02; transform: translate(-50%, -50%) scale(1.06); }
        }

        @media (max-width: 767px) {
            .beed-watermark {
                width: 300px;
                height: 300px;
            }
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--scrollbar-track);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
            border-radius: 10px;
            box-shadow: var(--glow-amber);
            transition: background 0.3s var(--ease);
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--beed-teal);
            box-shadow: var(--glow-teal);
        }

        /* ============================================================
               HEADER — Premium
               ============================================================ */
        header {
            background: var(--header-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            color: var(--beed-text);
            padding: 12px 32px;
            box-shadow: 0 4px 40px rgba(0, 0, 0, 0.03), inset 0 -1px 0 rgba(245, 166, 35, 0.12);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(200, 180, 160, 0.1);
            transition: background 0.5s var(--ease), border-color 0.5s var(--ease);
        }

        header::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--header-scan-color1), var(--header-scan-color2), var(--header-scan-color1), transparent);
            background-size: 300% 100%;
            animation: scanLine 8s linear infinite;
            opacity: 0.5;
            pointer-events: none;
        }

        @keyframes scanLine {
            0% { background-position: -300% 0; }
            100% { background-position: 300% 0; }
        }

        .header-container {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-shrink: 0;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 18px;
            flex: 1;
        }

        .logo {
            height: 80px;
            width: 80px;
            border-radius: 50%;
            background: var(--beed-bg-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
            border: 2px solid var(--beed-amber);
            box-shadow: 0 4px 24px rgba(245, 166, 35, 0.12), inset 0 0 40px rgba(245, 166, 35, 0.02);
            transition: all 0.4s var(--ease);
            position: relative;
        }

        .logo:hover,.beed-logo:hover {
            box-shadow: 0 6px 36px rgba(245, 166, 35, 0.2), inset 0 0 50px rgba(245, 166, 35, 0.04);
            border-color: var(--beed-teal);
            transform: scale(1.03) rotate(-2deg);
        }

        .logo img, .beed-logo img {
            height: 100%;
            width: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .logo-ring, .beed-logo-ring {
            position: absolute;
            inset: -5px;
            border-radius: 50%;
            border: 2px solid transparent;
            background: conic-gradient(from 0deg, var(--beed-amber), var(--beed-teal), var(--beed-gold), var(--beed-amber));
            -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px));
            animation: spinBorder 10s linear infinite;
            opacity: 0.4;
            pointer-events: none;
        }

        .beed-logo {
            height: 70px;
            width: 70px;
            border-radius: 50%;
            background: var(--beed-bg-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
            border: 2px solid var(--beed-amber);
            box-shadow: 0 4px 24px rgba(245, 166, 35, 0.12), inset 0 0 40px rgba(245, 166, 35, 0.02);
            transition: all 0.4s var(--ease);
            position: relative;
        }

        @keyframes spinBorder {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .title-block {
            flex: 1;
        }

        /* ============================================================
           HEADER TITLE — Futuristic font + gradient text (HEAD style)
           ============================================================ */
        .title-block h1 {
            font-family: 'Orbitron', 'Segoe UI', sans-serif;
            font-size: 1.05rem;
            font-weight: 800;
            line-height: 1.3;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #FFFFFF 0%, #FDE8B3 35%, #F7C948 70%, #F5A623 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            filter: drop-shadow(0 2px 10px rgba(245, 166, 35, 0.25));
            transition: filter 0.5s var(--ease);
        }

        .title-block h1:hover {
            filter: drop-shadow(0 4px 16px rgba(245, 166, 35, 0.45));
        }

        .title-block .sub-header {
            display: block;
            font-family: 'Quicksand', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--beed-text-muted);
            letter-spacing: 2.5px;
            opacity: 0.75;
            transition: color 0.5s var(--ease);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-shrink: 0;
        }

        .theme-toggle {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: var(--beed-text);
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s var(--ease);
            box-shadow: var(--glass-shadow);
        }

        .theme-toggle:hover {
            transform: scale(1.08);
            border-color: var(--beed-amber);
            box-shadow: var(--glow-amber);
        }

        .theme-toggle:active {
            transform: scale(0.94);
        }

        /* ============================================================
               MAIN
               ============================================================ */
        main {
            flex: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px 20px 40px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        /* ============================================================
               ANIMATIONS
               ============================================================ */
        @keyframes slideFadeIn {
            0% { opacity: 0; transform: translateY(40px) scale(0.96); filter: blur(10px); }
            60% { opacity: 0.8; transform: translateY(-4px) scale(1.005); filter: blur(0); }
            100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px) scale(0.97); filter: blur(4px); }
            to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
        }

        #app {
            animation: slideFadeIn 0.7s var(--ease) both;
        }

        .area-grid>*,
        .param-grid>*,
        .doc-grid>*,
        .hierarchy-grid>*,
        .extra-grid>*,
        .param-extra-grid>* {
            animation: fadeUp 0.5s var(--ease-spring) both;
        }

        /* ============================================================
               BREADCRUMB — Premium
               ============================================================ */
        .breadcrumb-wrapper {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: var(--radius-sm);
            border: 1px solid var(--glass-border);
            padding: 8px 20px 8px 28px;
            margin-bottom: 20px;
            box-shadow: var(--glass-shadow);
            transition: background 0.5s var(--ease), border-color 0.5s var(--ease);
        }

        .breadcrumb {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 4px;
            font-size: 0.85rem;
            color: var(--beed-text-muted);
            flex: 1;
        }

        .breadcrumb a {
            color: var(--beed-teal);
            text-decoration: none;
            font-weight: 600;
            padding: 4px 14px;
            border-radius: 8px;
            transition: all 0.25s var(--ease);
            font-size: 0.85rem;
            position: relative;
            background: transparent;
        }

        .breadcrumb a::after {
            content: '';
            position: absolute;
            bottom: 3px;
            left: 14px;
            right: 14px;
            height: 2px;
            background: var(--beed-amber);
            opacity: 0;
            transition: opacity 0.3s var(--ease);
            box-shadow: var(--glow-amber);
            border-radius: 2px;
        }

        .breadcrumb a:hover {
            /* ---- Was green — now orange ---- */
            background: rgba(232, 149, 58, 0.06);
            color: var(--beed-amber);
            transform: translateY(-1px);
        }

        .breadcrumb a:hover::after {
            opacity: 1;
        }

        .breadcrumb .sep {
            color: var(--beed-text-dim);
            font-size: 0.8rem;
            font-weight: 300;
            padding: 0 2px;
            opacity: 0.5;
        }

        .breadcrumb .current {
            color: var(--beed-text);
            font-weight: 700;
            padding: 4px 16px;
            font-size: 0.85rem;
            background: rgba(245, 166, 35, 0.06);
            border-radius: 8px;
            border: 1px solid rgba(245, 166, 35, 0.08);
            box-shadow: inset 0 0 20px rgba(245, 166, 35, 0.02);
            transition: background 0.5s var(--ease), color 0.5s var(--ease);
        }

        /* ---- SEARCH BAR ---- */
        .search-container {
            position: relative;
            display: flex;
            align-items: center;
            flex-shrink: 0;
        }

        .search-container input {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 1px solid rgba(200, 180, 160, 0.15);
            border-radius: var(--radius-full);
            padding: 8px 44px 8px 20px;
            font-size: 0.85rem;
            color: var(--beed-text);
            outline: none;
            transition: all 0.35s var(--ease);
            width: 200px;
            font-family: 'Inter', sans-serif;
            box-shadow: 0 1px 8px rgba(0, 0, 0, 0.02);
            min-height: 42px;
        }

        .search-container input::placeholder {
            color: var(--beed-text-dim);
            font-weight: 400;
            opacity: 0.7;
        }

        .search-container input:focus {
            border-color: var(--beed-amber);
            box-shadow: 0 0 0 3px rgba(245, 166, 35, 0.08), var(--glow-amber);
            width: 260px;
            background: rgba(255, 255, 255, 0.7);
        }

        .search-container .search-icon {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--beed-text-dim);
            font-size: 0.85rem;
            pointer-events: none;
            transition: color 0.3s var(--ease);
            opacity: 0.6;
        }

        .search-container input:focus~.search-icon {
            color: var(--beed-amber);
            opacity: 1;
        }

        .search-container .clear-search {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--beed-text-dim);
            font-size: 0.8rem;
            cursor: pointer;
            padding: 0;
            display: none;
            transition: color 0.2s;
            z-index: 2;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            align-items: center;
            justify-content: center;
        }

        .search-container .clear-search:hover {
            color: var(--beed-text);
            background: rgba(0, 0, 0, 0.04);
        }

        .search-container .clear-search.visible {
            display: flex;
        }

        .search-container input:focus~.search-icon {
            display: none;
        }

        .search-container .clear-search.visible~.search-icon {
            display: none;
        }

        /* ============================================================
           PAGE HEADER ROW
           ============================================================ */
        .page-header-row {
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 16px;
            margin: 4px 0 10px;
        }

        /* ============================================================
           PAGE TITLE — Futuristic font + gradient text (HEAD style)
           ============================================================ */
        .page-header-row h2 {
            text-align: center;
            margin: 0;
            font-family: 'Orbitron', 'Segoe UI', sans-serif;
            font-size: clamp(1.15rem, 2.2vw, 2.75rem);
            font-weight: 800;
            letter-spacing: 1.5px;
            position: relative;
            z-index: 1;
            padding: 0;
            background: linear-gradient(135deg, #D48E1A 0%, #F5A623 30%, #F7C948 55%, #E8953A 80%, #D48E1A 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            filter: drop-shadow(0 2px 12px rgba(245, 166, 35, 0.18));
            transition: filter 0.5s var(--ease);
            line-height: 1.35;
        }

        .page-header-row h2:hover {
            filter: drop-shadow(0 3px 18px rgba(245, 166, 35, 0.35));
        }

        .page-header-row h2 .accent {
            /* keep the span inside the gradient, no override */
            background: inherit;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
        }

        .page-header-row .btn-back {
            justify-self: start;
            padding: 10px 28px;
            font-size: 0.9rem;
        }

        .page-header-row .spacer {
            width: 120px;
        }

        /* ============================================================
           BUTTONS — Solid background + traveling light (BEED colors)
           ============================================================ */
        .btn-neon {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 16px 20px;
            border-radius: var(--radius);
            background: var(--beed-btn-bg);
            border: 2px solid #f5a5234c;
            color: var(--beed-text);
            font-weight: 600;
            font-size: 1.05rem;
            cursor: pointer;
            transition: all 0.3s var(--ease);
            overflow: visible;
            text-align: left;
            width: 100%;
            height: 100%;
            min-height: 130px; /* 120 before*/
            word-break: break-word;
            isolation: isolate;
            z-index: 1;
            box-shadow: var(--beed-shadow);
            will-change: transform, box-shadow;
        }

        .btn-neon::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: var(--radius);
            background: conic-gradient(
                from var(--angle),
                transparent 0deg,
                var(--border-color1, #F5A623) 10deg,
                transparent 24deg,
                transparent 176deg,
                var(--border-color1, #F5A623) 186deg,
                transparent 200deg,
                transparent 360deg
            );
            z-index: -2;
            animation: spinLight var(--border-speed, 5s) linear infinite;
            transition: filter 0.4s var(--ease), animation-duration 0.4s var(--ease);
            will-change: --angle;
            pointer-events: none;
            filter: blur(1px) drop-shadow(0 0 10px var(--border-color1));
            opacity: 0.5;
        }

        @keyframes spinLight {
            to { --angle: 360deg; }
        }

        .btn-neon::after {
            content: '';
            position: absolute;
            inset: 2px;
            border-radius: calc(var(--radius) - 2px);
            background: var(--beed-btn-after-bg);
            z-index: -1;
            transition: background 0.3s var(--ease);
        }

        .btn-neon:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: var(--btn-glow, var(--glow-amber)), var(--beed-shadow-hover);
        }

        .btn-neon:hover::before {
            animation-duration: calc(var(--border-speed, 5s) / 0.5);
            filter: blur(0px) drop-shadow(0 0 25px var(--border-color1)) brightness(1.5);
            opacity: 1;
        }

        .btn-neon:active {
            transform: scale(0.97) translateY(0);
            box-shadow: 0 0 50px rgba(245, 166, 35, 0.06), inset 0 0 40px rgba(245, 166, 35, 0.02);
            transition-duration: 0.1s;
        }

        .btn-neon:active::before {
            animation-duration: 5s;
            filter: blur(0px) drop-shadow(0 0 35px var(--border-color1)) brightness(2);
        }

        /* ---- Button Variants ---- */
        .btn-area-neon {
            --border-color1: var(--beed-amber);
            --border-speed: 14s;
            --btn-glow: var(--glow-amber);
        }

        .btn-param-neon {
            --border-color1: var(--beed-teal);
            --border-speed: 14s;
            --btn-glow: var(--glow-teal);
        }

        .btn-cat-neon {
            --border-color1: var(--beed-gold);
            --border-speed: 14s;
            --btn-glow: var(--glow-gold);
        }

        .btn-doc-neon {
            --border-color1: var(--beed-orange);
            --border-speed: 14s;
            --btn-glow: var(--glow-amber);
        }

        .btn-extra-neon {
            --border-color1: #F5A623;
            --border-speed: 14s;
            --btn-glow: var(--glow-teal);
        }

        /* ---- Icon styles ---- */
        .btn-neon .icon {
            font-size: 1.6rem;
            flex-shrink: 0;
            width: 2rem;
            text-align: center;
            filter: drop-shadow(0 0 10px var(--border-color1, rgba(245, 166, 35, 0.2)));
            transition: transform 0.3s var(--ease-spring);
        }

        .btn-neon:hover .icon {
            transform: scale(1.1) rotate(-3deg);
        }

        .btn-neon .btn-icon-sm {
            font-size: 1.2rem;
            flex-shrink: 0;
            width: 1.8rem;
            text-align: center;
        }

        /* ============================================================
           GRIDS
           ============================================================ */
        .area-grid,
        .param-grid,
        .doc-grid,
        .hierarchy-grid,
        .extra-grid,
        .param-extra-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 18px;
            margin-top: 24px;
        }

        .area-grid>*,
        .param-grid>*,
        .doc-grid>*,
        .hierarchy-grid>*,
        .extra-grid>*,
        .param-extra-grid>* {
            flex: 0 0 calc(25% - 18px);
            min-height: 120px;
            display: flex;
            border-radius: var(--radius);
            transition: all 0.3s var(--ease);
        }

        /* ---- AREA BUTTONS ---- */
        .area-grid>* {
            flex: 0 0 calc(25% - 18px);
        }
        .area-grid .num {
            flex-shrink: 0;
            width: 38px;
            height: 38px;
            border-radius: 8px;
            background: linear-gradient(160deg, var(--beed-amber), var(--beed-orange));
            color: #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 0.85rem;
            box-shadow: 0 2px 12px rgba(245, 166, 35, 0.2);
            transition: all 0.3s var(--ease);
        }
        .area-grid .btn-neon:hover .num {
            box-shadow: 0 0 30px rgba(245, 166, 35, 0.3);
            transform: scale(1.05);
        }
        .area-grid .label {
            flex: 1;
            font-weight: 700;
            font-size: 1.5rem; /* 1.05 before */
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            max-height: 3.8em;
            line-height: 1.3;
            color: var(--beed-text);
            transition: color 0.3s var(--ease);
        }
        .area-grid .arrow {
            font-size: 1.2rem;
            opacity: 0.6;
            flex-shrink: 0;
            transition: transform 0.3s var(--ease), opacity 0.3s var(--ease);
            color: var(--beed-amber);
        }
        .area-grid .btn-neon:hover .arrow {
            transform: translateX(6px);
            opacity: 1;
        }

        /* ---- PARAMETER BUTTONS ---- */
        .param-grid>* {
            flex: 0 0 calc(33% - 18px);  /*-- 25%(4 column botton) before --*/
        }
        .param-grid .letter {
                flex-shrink: 0;
                width: 34px;
                height: 34px;
                border-radius: 50%;
                background:rgba(245, 165, 35, 0.092);
                border: 1px solid #F5A623;
                color: #FFFFFF;
                display: flex;
                align-items: center;
                justify-content: center;
                font-family: 'JetBrains Mono', monospace;
                font-weight: 600;
                font-size: .85rem;
                box-shadow: 0 2px 12px rgba(232, 149, 58, 0.2);
        }
        .param-grid .btn-neon:hover .letter {
            /* ---- Was green — now orange ---- */
            box-shadow: 0 0 30px rgba(232, 149, 58, 0.3);
            transform: scale(1.05);
        }
        .param-grid .label {
            flex: 1;
            font-weight: 700;
            font-size: 1.2rem; /* 1.05 before */
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            max-height: 3.8em;
            line-height: 1.3;
            color: var(--beed-text);
            transition: color 0.3s var(--ease);
        }
        .param-grid .arrow {
            font-size: 1.2rem;
            opacity: 0.6;
            flex-shrink: 0;
            transition: transform 0.3s var(--ease), opacity 0.3s var(--ease);
            color: var(--beed-amber);
        }
        .param-grid .btn-neon:hover .arrow {
            transform: translateX(6px);
            opacity: 1;
        }

        /* ---- DOC CATEGORY BUTTONS ---- */
        .doc-grid>* {
            flex: 0 0 calc(25% - 18px);
        }
        .doc-grid .btn-neon {
            flex-direction: column;
            gap: 8px;
            text-align: center;
            min-height: 130px;
        }
        .doc-grid .btn-neon .icon {
            font-size: 2.4rem;
            width: auto;
            filter: drop-shadow(0 0 20px rgba(247, 201, 72, 0.15));
        }
        .doc-grid .btn-neon:hover .icon {
            transform: scale(1.1) translateY(-2px);
        }
        .doc-grid .label {
            font-weight: 700;
            font-size: 1.5rem; /* 1.05 before */
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            max-height: 2.6em;
            line-height: 1.3;
            color: var(--beed-text);
            transition: color 0.3s var(--ease);
        }

        /* ---- HIERARCHY BUTTONS ---- */
        .hierarchy-grid>* {
            flex: 0 0 calc(50% - 18px);/*--  before 25%/ 4 column - maximum column of botton --*/
            min-height: 100px;
        }
        .hierarchy-grid .btn-neon {
            justify-content: flex-start;
            gap: 14px;
            padding: 14px 20px;
            min-height: 80px;
        }
        .hierarchy-grid .file-icon {
            font-size: 1.6rem;
            flex-shrink: 0;
            filter: drop-shadow(0 0 16px rgba(245, 166, 35, 0.1));
            width: 2rem;
            text-align: center;
            color: var(--beed-amber);
            transition: transform 0.3s var(--ease-spring), color 0.3s var(--ease);
        }
        .hierarchy-grid .btn-neon:hover .file-icon {
            transform: scale(1.1) rotate(-3deg);
            color: var(--beed-teal);
        }
        .hierarchy-grid .file-name {
            flex: 1;
            font-weight: 600;
            word-break: break-word;
            font-size: 1.3rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            max-height: 2.6em;
            line-height: 1.3;
            color: var(--beed-text);
            transition: color 0.3s var(--ease);
        }
        .hierarchy-grid .arrow {
            font-size: 1.2rem;
            opacity: 0.5;
            flex-shrink: 0;
            transition: transform 0.3s var(--ease), opacity 0.3s var(--ease);
            color: var(--beed-amber);
        }
        .hierarchy-grid .btn-neon:hover .arrow {
            transform: translateX(6px);
            opacity: 1;
        }

        /* ---- EXTRA BUTTONS ---- */
        .extra-grid>* {
            flex: 0 0 calc(25% - 18px);
            min-height: 100px;/* 80 before */
        }
        .param-extra-grid>* {
            flex: 0 0 calc(25% - 18px);
            min-height: 100px;/* 80 before */
        }
        .extra-grid .btn-neon,
        .param-extra-grid .btn-neon {
            justify-content: center;
            gap: 10px;
            min-height: 100px;/* 80 before */
            font-size: 1.3rem;
            padding: 14px 18px;
            text-align: center;
        }

        .extra-grid .btn-neon .icon,
        .param-extra-grid .btn-neon .icon {
            font-size: 1.4rem;
            width: auto;
            color: var(--beed-teal);
            /* ---- Was green — now orange ---- */
            filter: drop-shadow(0 0 12px rgba(232, 149, 58, 0.06));
        }

        .extra-grid .btn-neon:hover .icon,
        .param-extra-grid .btn-neon:hover .icon {
            transform: scale(1.1) rotate(-2deg);
        }

        /* ---- FILTERED ---- */
        .grid-item-hidden {
            display: none !important;
        }

        /* ============================================================
           BACK BUTTON — Premium (solid bg, traveling light)
           ============================================================ */
        .btn-back {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 28px;
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--beed-text);
            background: var(--beed-btn-bg);
            border: none;
            cursor: pointer;
            transition: all 0.3s var(--ease);
            text-decoration: none;
            position: relative;
            overflow: visible;
            isolation: isolate;
            box-shadow: var(--beed-shadow);
            min-height: 48px;
        }

        .btn-back::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: var(--radius-sm);
            background: conic-gradient(
                from var(--angle),
                transparent 0deg,
                var(--beed-amber) 10deg,
                transparent 24deg,
                transparent 176deg,
                var(--beed-amber) 186deg,
                transparent 200deg,
                transparent 360deg
            );
            z-index: -2;
            animation: spinLight 8s linear infinite;
            will-change: --angle;
            pointer-events: none;
            filter: blur(1px) drop-shadow(0 0 8px var(--beed-amber));
            opacity: 0.4;
        }

        .btn-back::after {
            content: '';
            position: absolute;
            inset: 2px;
            border-radius: calc(var(--radius-sm) - 2px);
            background: var(--beed-btn-after-bg);
            z-index: -1;
            transition: background 0.3s var(--ease);
        }

        .btn-back:hover {
            transform: translateY(-3px);
            border-color: var(--beed-amber);
            box-shadow: var(--glow-amber), var(--beed-shadow-hover);
        }

        .btn-back:hover::before {
            animation-duration: 20.8s;
            filter: blur(0px) drop-shadow(0 0 20px var(--beed-amber)) brightness(1.5);
            opacity: 1;
        }

        .btn-back:active {
            transform: scale(0.96);
        }

        /* ============================================================
           OPEN BUTTON — Premium 
           ============================================================ */
        .btn-open {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 36px;
            border-radius: var(--radius-sm);
            font-size: 1rem;
            font-weight: 700;
            color: var(--beed-text);
            background: var(--beed-btn-bg);
            border: none;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s var(--ease);
            position: relative;
            overflow: visible;
            isolation: isolate;
            box-shadow: var(--beed-shadow);
            min-height: 52px;
        }

        .btn-open::before {
            content: '';

                transparent 0deg,

                transparent 24deg,
                transparent 176deg,
                var(--beed-amber) 186deg,
                transparent 200deg,
                transparent 360deg
            );
            z-index: -2;
            animation: spinLight 3s linear infinite;
            will-change: --angle;
            pointer-events: none;
            filter: blur(1px) drop-shadow(0 0 10px var(--beed-amber));
            opacity: 0.4;
        }

        .btn-open::after {
            content: '';
            position: absolute;
            inset: 2px;
            border-radius: calc(var(--radius-sm) - 2px);
            background: var(--beed-btn-after-bg);
            z-index: -1;
            transition: background 0.3s var(--ease);
        }

            transform: translateY(-4px);
            box-shadow: var(--glow-amber-strong), var(--beed-shadow-hover);
        }

        .btn-open:hover::before {
            animation-duration: 1.5s;
            filter: blur(0px) drop-shadow(0 0 25px var(--beed-amber)) brightness(1.5);
            opacity: 1;
        }

        .btn-open:active {
            transform: scale(0.96);
        }

           ============================================================ */
        .pdf-container {
            background: var(--beed-card);
            border-radius: var(--radius);

            margin: 24px 0 16px;
            border: 1px solid var(--beed-card-border);
            box-shadow: var(--beed-shadow), var(--glow-amber);
            transition: border-color 0.4s var(--ease), box-shadow 0.4s var(--ease);
            position: relative;
        }

        .pdf-container:hover {
            border-color: rgba(245, 166, 35, 0.2);
            box-shadow: var(--beed-shadow-hover), var(--glow-amber-strong);
        }

        .pdf-container::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: var(--radius);
            background: conic-gradient(from 0deg,

                    rgba(245, 166, 35, 0.03),

                    rgba(232, 149, 58, 0.03),

            z-index: -1;
            animation: spinBorder 12s linear infinite;

        }

            display: block;
            border: none;
            width: 100%;
            min-height: 700px;
            background: var(--beed-bg-secondary);
            transition: background 0.5s var(--ease);

        // ============================================================
        // HELPER FUNCTIONS
        // ============================================================
        function getParamsForProgram(program, areaNum) {
            var areaData = AREAS_FULL[areaNum];
            return areaData ? areaData.params : {};
        }

        function getAreaNameForProgram(program, areaNum) {
            var areaData = AREAS_FULL[areaNum];
            return areaData ? areaData.name : 'Area ' + areaNum;
        }

        function getDocumentFiles(program, area, param, catKey) {
            var key = program + '-' + area + '-' + param + '-' + catKey;
            return DOCUMENT_FILES[key] || [];
        }

        function getDriveLink(fileId) {
            if (!fileId || fileId === 'FILE_ID_HERE' || fileId === 'FILE_ID_HERE_2' || fileId === 'FILE_ID_HERE_3' ||
                fileId.indexOf('SAMPLE_') === 0 || fileId.indexOf('_FILE_ID') !== -1) return null;
            return 'https://drive.google.com/file/d/' + fileId + '/preview';
        }

        function getDriveOpenLink(fileId) {
            if (!fileId || fileId === 'FILE_ID_HERE' || fileId === 'FILE_ID_HERE_2' || fileId === 'FILE_ID_HERE_3' ||
                fileId.indexOf('SAMPLE_') === 0 || fileId.indexOf('_FILE_ID') !== -1) return null;
            return 'https://drive.google.com/file/d/' + fileId + '/view?usp=sharing';
        }

        function getExtraFileId(type, area, param) {
            var map = EXTRA_FILE_IDS[type];
            if (!map) return null;
            if (type === 'additional' || type === 'compliance' || type === 'selfsurvey') {
                return map[String(area)] || null;
            } else if (type === 'ppp' || type === 'bestpractices') {
                if (!param) return null;
                var key = area + '-' + param;
                return map[key] || null;
            }
            return null;
        }

        function getAllSearchableTextForArea(areaNum) {
            var texts = [];
            var areaData = AREAS_FULL[areaNum];
            if (!areaData) return '';
            texts.push(areaData.name);
            var params = areaData.params;
            for (var p in params) {
                texts.push(params[p]);
            }
            var prefix = 'BEED-' + areaNum + '-';
            for (var key in DOCUMENT_FILES) {
                if (key.indexOf(prefix) === 0) {
                    var files = DOCUMENT_FILES[key];
                    for (var f = 0; f < files.length; f++) {
                        texts.push(files[f].name);
                    }
                }
            }
            var extraTypes = ['additional', 'compliance', 'selfsurvey'];
            var nameMap = {
                'additional': 'Additional Needed Requirements',
                'compliance': 'Compliance with AACUP Recommendations',
                'selfsurvey': 'Self Survey'
            };
            for (var t = 0; t < extraTypes.length; t++) {
                var type = extraTypes[t];
                var fileId = getExtraFileId(type, areaNum);
                if (fileId) {
                    texts.push(nameMap[type]);
                }
            }
            for (var p2 in params) {
                var pppId = getExtraFileId('ppp', areaNum, p2);
                if (pppId) texts.push('PPP');
                var bestId = getExtraFileId('bestpractices', areaNum, p2);
                if (bestId) texts.push('Best Practice/s');
            }
            return texts.join(' ').toLowerCase();
        }

        // HIERARCHY BUILDER
        function parseHierarchyCode(name) {
            var cleaned = name.replace(/\.\s+/g, '.').replace(/\s+\./g, '.');
            var match = cleaned.match(/^([A-Z]\.\d+(?:\.\d+)*)/);
            return match ? match[1] : null;
        }

        function buildHierarchy(files) {
            var root = { children: [] };
            var nodeMap = {};
            files.forEach(function(file) {
                var code = parseHierarchyCode(file.name);
                if (!code) return;
                if (!nodeMap[code]) nodeMap[code] = { code: code, name: file.name, id: null, index: null,
                    children: [] };
            });
            files.forEach(function(file, index) {
                var code = parseHierarchyCode(file.name);
                if (!code) { root.children.push({ code: null, name: file.name, id: file.id, index: index,
                        children: [] });
                    return; }
                var node = nodeMap[code];
                if (node) { node.id = file.id;
                    node.index = index;
                    node.name = file.name; }
            });
            var allCodes = Object.keys(nodeMap);
            allCodes.forEach(function(code) {
                var parts = code.split('.');
                if (parts.length === 1) { root.children.push(nodeMap[code]); } else {
                    var parentCode = parts.slice(0, -1).join('.');
                    if (nodeMap[parentCode]) nodeMap[parentCode].children.push(nodeMap[code]);
                    else root.children.push(nodeMap[code]);
                }
            });

            function sortChildren(node) {
                if (node.children) {
                    node.children.sort(function(a, b) {
                        var aParts = a.code.split('.').length ? a.code.split('.') : [''],
                            bParts = b.code.split('.').length ? b.code.split('.') : [''];
                        for (var i = 0; i < Math.min(aParts.length, bParts.length); i++) {
                            if (aParts[i] !== bParts[i]) {
                                var aNum = parseInt(aParts[i]),
                                    bNum = parseInt(bParts[i]);
                                if (!isNaN(aNum) && !isNaN(bNum)) return aNum - bNum;
                                return aParts[i].localeCompare(bParts[i]);
                            }
                        }
                        return aParts.length - bParts.length;
                    });
                    node.children.forEach(sortChildren);
                }
            }
            sortChildren(root);
            return root.children;
        }

        // ============================================================
        // ROUTER
        // ============================================================
        var state = {
            page: 'landing',
            program: PROGRAM_CODE,
            area: null,
            param: null,
            category: null,
            fileIndex: null,
            currentPath: [],
            specialFileId: null,
            specialFileName: null,
            specialType: null,
            fromArea: null,
            fromParam: null
        };

        function parseHash() {
            var hash = window.location.hash.replace(/^#/, '') || '/';
            var parts = hash.split('/').filter(Boolean);
            if (parts.length === 0) return { page: 'landing' };
            if (parts.length === 1) {
                var page = parts[0];
                if (page === 'additional' || page === 'compliance' || page === 'selfsurvey' ||
                    page === 'ppp' || page === 'bestpractices') {
                    return { page: 'special', specialType: page };
                }
                if (AREAS_FULL[page]) return { page: 'area', area: page };
                else return { page: 'notfound' };
            }
            if (parts.length === 2) {
                var area = parts[0],
                    param = parts[1];
                var params = getParamsForProgram(PROGRAM_CODE, area);
                if (AREAS_FULL[area] && params[param]) return { page: 'parameter', area: area, param: param };
                else return { page: 'notfound' };
            }
            if (parts.length === 3) {
                var area = parts[0],
                    param = parts[1],
                    cat = parts[2];
                var isValidCat = CATEGORIES.some(function(c) { return c.key === cat; });
                var params2 = getParamsForProgram(PROGRAM_CODE, area);
                if (AREAS_FULL[area] && params2[param] && isValidCat) return { page: 'category', area: area,
                    param: param, category: cat };
                else return { page: 'notfound' };
            }
            if (parts.length === 4) {
                var area = parts[0],
                    param = parts[1],
                    cat = parts[2],
                    idx = parseInt(parts[3]);
                var isValidCat2 = CATEGORIES.some(function(c) { return c.key === cat; });
                var params3 = getParamsForProgram(PROGRAM_CODE, area);
                if (AREAS_FULL[area] && params3[param] && isValidCat2 && !isNaN(idx)) return { page: 'document',
                    area: area, param: param, category: cat, fileIndex: idx };
                else return { page: 'notfound' };
            }
            return { page: 'notfound' };
        }

        function navigateTo(page, data) {
            data = data || {};
            var newState = Object.assign({}, state, { page: page }, data);
            state = newState;
            var parts = [];
            if (data.area) parts.push(data.area);
            if (data.param) parts.push(data.param);
            if (data.category) parts.push(data.category);
            if (data.fileIndex !== undefined && data.fileIndex !== null) parts.push(data.fileIndex);
            if (page === 'special' && data.specialType) {
                parts = [data.specialType];
            }
            var hash = parts.length ? '#/' + parts.join('/') : '#/';
            window.location.hash = hash;
            render();
        }

        window.addEventListener('hashchange', function() {
            var parsed = parseHash();
            state = Object.assign({}, state, parsed);
            render();
        });

        // ============================================================
        // RENDER FUNCTIONS

        function applyStaggeredAnimation(container) {
            if (!container) return;
            var items = container.children;
            for (var i = 0; i < items.length; i++) {
                items[i].style.animationDelay = ((i + 1) * 0.05) + 's';
            }
        }

        function renderNotFound() {
            var wrap = document.createElement('div');
            wrap.innerHTML =
                '<div class="empty-state" style="margin-top:60px;"><div class="icon"><i class="fas fa-search"></i></div><h3>Page Not Found</h3><p>The requested page does not exist in this accreditation system.</p><button class="btn-back" onclick="navigateTo(\'landing\',{})">← Go to Home</button></div>';
            return wrap;
        }

        // ---- BREADCRUMB FUNCTIONS ----
        function crumbWithSearch(items) {
            var clickable = items.slice(0, -1);
            var html = '<div class="breadcrumb-wrapper">';
            html += '<nav class="breadcrumb">';
            clickable.forEach(function(it, i) {
                html += '<a href="#" data-crumb="' + i + '">' + it.label + '</a>';
                if (i < clickable.length - 1) html += '<span class="sep">›</span>';
            });
            if (items.length > 0) {
                var last = items[items.length - 1];
                if (clickable.length > 0) html += '<span class="sep">›</span>';
                html += '<span class="current">' + last.label + '</span>';
            }
            html += '</nav>';
            html += '<div class="search-container">';
            html += '<input type="text" id="globalSearch" placeholder="Search areas, parameters..." autocomplete="off" />';
            html += '<i class="fas fa-search search-icon"></i>';
            html += '<button class="clear-search" id="clearSearch" aria-label="Clear search"><i class="fas fa-times"></i></button>';
            html += '</div>';
            html += '</div>';
            return html;
        }

        function crumbWithoutSearch(items) {
            var clickable = items.slice(0, -1);
            var html = '<div class="breadcrumb-wrapper">';
            html += '<nav class="breadcrumb">';
            clickable.forEach(function(it, i) {
                html += '<a href="#" data-crumb="' + i + '">' + it.label + '</a>';
                if (i < clickable.length - 1) html += '<span class="sep">›</span>';
            });
            if (items.length > 0) {
                var last = items[items.length - 1];
                if (clickable.length > 0) html += '<span class="sep">›</span>';
                html += '<span class="current">' + last.label + '</span>';
            }
            html += '</nav>';
            html += '</div>';
            return html;
        }

        function bindCrumbs(container, items, withSearch) {
            var clickable = items.slice(0, -1);
            container.querySelectorAll('[data-crumb]').forEach(function(a) {
                var idx = Number(a.dataset.crumb);
                if (idx < clickable.length) {
                    a.addEventListener('click', function(e) { e.preventDefault();
                        clickable[idx].go(); });
                }
            });

            if (withSearch) {
                var searchInput = container.querySelector('#globalSearch');
                if (searchInput) {
                    var newInput = searchInput.cloneNode(true);
                    searchInput.parentNode.replaceChild(newInput, searchInput);

                    newInput.addEventListener('input', function() {
                        var query = this.value.trim().toLowerCase();
                        var clear = container.querySelector('#clearSearch');
                        if (clear) {
                            if (query.length > 0) {
                                clear.classList.add('visible');
                            } else {
                                clear.classList.remove('visible');
                            }
                        }
                        filterGridItems(container, query);
                    });

                    var newClear = container.querySelector('#clearSearch');
                    if (newClear) {
                        newClear.addEventListener('click', function() {
                            var inp = container.querySelector('#globalSearch');
                            if (inp) {
                                inp.value = '';
                                inp.dispatchEvent(new Event('input'));
                            }
                            this.classList.remove('visible');
                        });
                    }
                }
            }
        }

        function filterGridItems(container, query) {
            var grids = container.querySelectorAll('.area-grid, .param-grid, .doc-grid, .hierarchy-grid, .extra-grid, .param-extra-grid');
            grids.forEach(function(grid) {
                var items = grid.children;
                for (var i = 0; i < items.length; i++) {
                    var item = items[i];
                    var show = false;
                    if (query === '') {
                        show = true;
                    } else {
                        if (state.page === 'landing') {
                            var btn = item.querySelector('.btn-neon');
                            if (btn && btn.dataset.area) {
                                var areaNum = btn.dataset.area;
                                var searchableText = getAllSearchableTextForArea(areaNum);
                                if (searchableText.indexOf(query) !== -1) {
                                    show = true;
                                }
                            }
                        } else {
                            var text = item.textContent.toLowerCase();
                            var dataText = '';
                            var btn2 = item.querySelector('.btn-neon');
                            if (btn2) {
                                if (btn2.dataset.area) dataText += ' ' + btn2.dataset.area;
                                if (btn2.dataset.param) dataText += ' ' + btn2.dataset.param;
                                if (btn2.dataset.cat) dataText += ' ' + btn2.dataset.cat;
                                if (btn2.dataset.type) dataText += ' ' + btn2.dataset.type;
                            }
                            var fullText = text + ' ' + dataText;
                            if (fullText.indexOf(query) !== -1) {
                                show = true;
                            }
                        }
                    }
                    if (show) {
                        item.classList.remove('grid-item-hidden');
                    } else {
                        item.classList.add('grid-item-hidden');
                    }
                }
            });
        }

        function render() {
            var app = document.getElementById('app');
            app.innerHTML = '';
            app.classList.remove('is-visible');
            var node;
            switch (state.page) {
                case 'landing':
                    node = renderLanding();
                    break;
                case 'area':
                    node = renderArea();
                    break;
                case 'parameter':
                    node = renderParameter();
                    break;
                case 'category':
                    node = renderCategory();
                    break;
                case 'document':
                    node = renderDocument();
                    break;
                case 'special':
                    node = renderSpecialDocument();
                    break;
                default:
                    node = renderNotFound();
            }
            app.appendChild(node);
            void app.offsetWidth;
            app.style.animation = 'none';
            void app.offsetHeight;
            app.style.animation = '';
            app.classList.add('is-visible');

            var grids = node.querySelectorAll('.area-grid, .param-grid, .doc-grid, .hierarchy-grid, .extra-grid, .param-extra-grid');
            for (var g = 0; g < grids.length; g++) {
                applyStaggeredAnimation(grids[g]);
            }

            var title = 'BEED — AACCUP Accreditation';
            if (state.page === 'area' && state.area) { var areaName = getAreaNameForProgram(PROGRAM_CODE, state.area);
                title = 'Area ' + state.area + ' — ' + areaName; } else if (state.page === 'parameter' && state.param) {
                var pn = getParamsForProgram(PROGRAM_CODE, state.area)[state.param] || 'Parameter';
                title = pn; } else if (state.page === 'category') { var cat = CATEGORIES.find(function(c) { return c
                        .key === state.category; });
                title = cat ? cat.label : state.category; } else if (state.page === 'document') { var files =
                    getDocumentFiles(PROGRAM_CODE, state.area, state.param, state.category);
                var f = files[state.fileIndex];
                title = f ? f.name : 'Document'; } else if (state.page === 'special') { title = state.specialFileName ||
                    'Document'; }
            document.title = title + ' | BEED | OMSC';
        }
